<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/item.css">
    <script src="https://kit.fontawesome.com/b782cf5553.js" crossorigin="anonymous"></script> 
    <script src="js/footer.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <div id="navbar"></div>



    <div class="content sec1">
        <div class="cent">
            <div class="grid_content grid1">
                <div class="image_cont">
                    <!-- <img src="images\Men-Sneakers-Running-Shoes-Lace-up-Sport-Shoes-shopby-online-mall-1.jpg" alt=""> -->
                </div>
            </div>

               <div class="grid_content grid2">
                <h1>white sneakers</h1>
                <h4 class="red">Enterprise</h4>
                <h4 class="">In Stock: </h4>

                   <h4 class="category">
                    fashion
                </h4>


                <!-- <span>
                  
                </span> -->

                <h4 class="price"><i class="fa-solid fa-naira-sign"></i>50000</h4>
                <div class="quan">
                    <div class="minus"><i class="fa-solid fa-minus"></i></div>
                    <div class="quantity">1</div>
                    <div class="plus"><i class="fa-solid fa-plus"></i></div>
                </div>

                <div class="add_cont">
                 <form enctype="multipart/form-data"> <input type="text" class="cart_value">  <button class="cart"> Add to Cart</button></form> 
                    <div class="favourite">
                      <i class="fa-solid fa-bookmark"></i>
                    </div>
                </div>
             
            </div>
        </div>
    </div>

    <div class="content sec2">
        <div class="cent">
        

            <div class="grid2">
               <h1>Reviews</h1>

               <div class="reviews">
                <div class="review_card">
                    <div class="id">
                        <span></span>
                    </div>
                </div>
               </div>
            </div>
            
        </div>
    </div>

    <div id="footer"></div>
